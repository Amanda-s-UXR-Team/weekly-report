name: Seven-Country Daily Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 'check = 离线测试及配置检查；send = 真实采集、调用模型并推送飞书'
        required: true
        default: check
        type: choice
        options: [check, send]
  schedule:
    - cron: '25 22 * * *' # 北京时间每日 06:25；需 ENABLE_DAILY_PUSH=true

permissions:
  contents: read

concurrency:
  group: seven-country-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.ENABLE_DAILY_PUSH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF libraries and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-noto-cjk fonts-wqy-zenhei fonts-noto-color-emoji
          python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Render offline sample PDF
        run: python tools/preview_offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: offline-preview-${{ github.run_id }}
          path: output/offline-sample.pdf
          retention-days: 7

  configured-run:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_DAILY_PUSH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BOT_CHAT_ID: ${{ secrets.FEISHU_BOT_CHAT_ID }}
      FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
      FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
      FEISHU_ARCHIVE_ROOT_FOLDER_TOKEN: ${{ secrets.FEISHU_ARCHIVE_ROOT_FOLDER_TOKEN }}
      FEISHU_SIX_COUNTRY_FOLDER_NAME: ${{ vars.FEISHU_SIX_COUNTRY_FOLDER_NAME || '六国洞察报告' }}
      REQUIRE_FEISHU_DELIVERY: 'true'
      MONITOR_DESTINATION_TIER: production
      MONITOR_RECEIPT_PATH: output/monitor/receipt.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check configuration without exposing values
        run: python tools/check_config.py
      - name: Install PDF libraries and Chinese fonts
        if: github.event_name == 'schedule' || inputs.operation == 'send'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-noto-cjk fonts-wqy-zenhei fonts-noto-color-emoji
      - name: Collect, summarize, render and send
        if: github.event_name == 'schedule' || inputs.operation == 'send'
        run: python main.py
      - name: Save PDF and delivery receipt
        if: always() && (github.event_name == 'schedule' || inputs.operation == 'send')
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            output/*.pdf
            output/monitor/receipt.json
          if-no-files-found: warn
          retention-days: 30
